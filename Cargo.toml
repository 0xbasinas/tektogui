[workspace]
resolver = "2"
members = [
    "crates/tekto-tree",
    "crates/tekto-layout",
    "crates/tekto-text",
    "crates/tekto-render",
    "crates/tekto-platform",
    "crates/tekto-a11y",
    "crates/tekto-mcp",
    "crates/tekto-js",
    "crates/tekto-native",
    "crates/tekto-widgets",
    "crates/tekto",
    "crates/tekto-cli",
    "crates/tekto-wasm",
    "examples/notes",
    "examples/notes-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/0xbasinas/tektogui"
rust-version = "1.88"
authors = ["0xbasinas <241305723+0xbasinas@users.noreply.github.com>"]

[workspace.dependencies]
tekto-tree = { path = "crates/tekto-tree", version = "0.1.0" }
tekto-layout = { path = "crates/tekto-layout", version = "0.1.0" }
tekto-text = { path = "crates/tekto-text", version = "0.1.0" }
tekto-render = { path = "crates/tekto-render", version = "0.1.0" }
tekto-platform = { path = "crates/tekto-platform", version = "0.1.0" }
tekto-a11y = { path = "crates/tekto-a11y", version = "0.1.0" }
tekto-mcp = { path = "crates/tekto-mcp", version = "0.1.0" }
tekto-js = { path = "crates/tekto-js", version = "0.1.0" }
tekto-native = { path = "crates/tekto-native", version = "0.1.0" }
tekto-widgets = { path = "crates/tekto-widgets", version = "0.1.0" }
tekto = { path = "crates/tekto", version = "0.1.0" }
tekto-wasm = { path = "crates/tekto-wasm", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
taffy = "0.15"
parley = { version = "0.12", default-features = false, features = ["std"] }
tiny-skia = "0.12"
skrifa = "0.44"
winit = "0.30.13"
softbuffer = "0.4"
accesskit = "0.21"
# Optional GPU path (`tekto` feature `gpu`). Not in the default graph.
# vello 0.10 (Apache-2.0 OR MIT). wgpu is pinned here so we can leave
# dx12 off: wgpu-hal 29 does not compile its DX12 backend against the
# `windows` crate versions cargo selects for `x86_64-pc-windows-gnu`.
vello = { version = "0.10.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "29.0.4", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "gles",
    "metal",
] }
pollster = "0.4"
png = "0.18"
accesskit_winit = { version = "0.29.2", default-features = false }
clap = { version = "4.5", features = ["derive"] }

# Fast incremental builds. Do not raise opt-level on deps here; that slows compile.
[profile.dev]
debug = 1
incremental = true

# Small, reasonably fast release binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optional faster runtime during local demo runs, still incremental.
[profile.dev-fast]
inherits = "dev"
opt-level = 1
