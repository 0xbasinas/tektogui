[package]
name = "tekto-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Plugin-style native APIs (files, clipboard, notifications, tray, shortcuts) for Rust and TypeScript"
publish = false

[features]
# System tray. Off by default so apps that do not show a tray do not compile
# this client. No extra crate: Linux StatusNotifierItem, Windows Shell_NotifyIconW.
tray = []
# Global shortcuts. Off by default so apps that do not register shortcuts
# do not compile this client. Linux uses x11rb. Windows uses RegisterHotKey
# (no extra crate).
shortcuts = ["dep:x11rb"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }


# arboard 3.7.0 is MIT OR Apache-2.0. Text only (no image-data). Wayland uses
# `wayland-data-control` (wl-clipboard-rs, MIT OR Apache-2.0). X11 uses x11rb
# (MIT OR Apache-2.0). Windows uses arboard without the Wayland feature.
[target.'cfg(target_os = "linux")'.dependencies]
# libc is MIT OR Apache-2.0; openat confines file access without symlink races.
libc = "0.2"
# x11rb 0.13.2 is MIT OR Apache-2.0. Pure Rust X11 (no libxcb). Used only
# for the optional `shortcuts` feature on Linux. Default features off so the
# XCB FFI and extensions stay out. Windows shortcuts do not use this crate.
x11rb = { version = "0.13.2", optional = true, default-features = false }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.7.0", default-features = false }

# Android notifications. Both crates are MIT OR Apache-2.0. `ndk-context` is
# the same 0.1 handle `android-activity` publishes. `jni` default features
# stay off (no JVM launcher).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
ndk-context = "0.1.1"

[dev-dependencies]
serde_json = { workspace = true }
