[package]
name = "tekto-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tekto renderer trait, tiny-skia CPU backend, and a GPU stub"
publish = false

[features]
default = ["cpu"]
cpu = ["dep:tiny-skia", "dep:skrifa", "dep:tekto-text", "dep:parley"]
# wgpu + Vello. Heavy to compile. Off unless the app asks for `gpu`.
gpu = ["dep:vello", "dep:wgpu", "dep:pollster", "dep:png", "dep:tekto-text", "dep:parley"]

[dependencies]
tekto-tree = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }
tekto-text = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
png = { workspace = true, optional = true }
