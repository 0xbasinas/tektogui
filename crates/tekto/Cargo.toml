[package]
name = "tekto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tekto app API: build a tree, run it windowed or headless, talk to agents"
publish = false

[features]
default = ["cpu", "desktop"]
cpu = ["tekto-render/cpu", "tekto-platform/cpu"]
desktop = ["tekto-platform/desktop", "cpu"]
gpu = ["tekto-render/gpu", "tekto-platform/gpu"]
a11y-os = ["tekto-platform/a11y-os"]
image-png = ["tekto-tree/image-png"]
js = ["dep:tekto-js"]
# Embeds QuickJS-ng. Off by default; do not enable on PR CI.
quickjs = ["js", "tekto-js/quickjs"]
# System tray (Linux StatusNotifierItem, Windows Shell_NotifyIconW). Off by default.
tray = ["tekto-native/tray"]
# Global shortcuts (Linux X11 grab, Windows RegisterHotKey). Off by default.
shortcuts = ["tekto-native/shortcuts", "tekto-js?/shortcuts"]

[dependencies]
tekto-tree = { workspace = true }
tekto-layout = { workspace = true }
tekto-text = { workspace = true }
tekto-render = { workspace = true }
tekto-platform = { workspace = true }
tekto-a11y = { workspace = true }
tekto-mcp = { workspace = true }
tekto-native = { workspace = true }
tekto-widgets = { workspace = true }
tekto-js = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tekto-js = { workspace = true }
