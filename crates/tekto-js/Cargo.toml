[package]
name = "tekto-js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TypeScript runtime bindings. On desktop this embeds QuickJS-ng behind a feature flag; on the web, apps use the browser JS engine."
publish = false

[features]
default = []
# QuickJS-ng via rquickjs (both MIT). Off by default: compiling the engine is slow.
# Do not enable this on PR CI.
quickjs = ["dep:rquickjs"]
# Linux X11 global shortcuts in tekto-native. Off by default.
shortcuts = ["tekto-native/shortcuts"]

[dependencies]
tekto-tree = { workspace = true }
tekto-native = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
rquickjs = { version = "0.14", optional = true, default-features = true }

[dev-dependencies]
serde_json = { workspace = true }

# rquickjs-sys 0.14 ships no Android bindgen files. Enable bindgen only
# when targeting Android so desktop `--features quickjs` stays off this path.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", optional = true, default-features = true, features = ["bindgen"] }
