[package]
name = "tekto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tekto command line: new, dev, build, test, and agent commands"
publish = false

[[bin]]
name = "tekto"
path = "src/main.rs"

[features]
default = []
# Embeds QuickJS-ng. Off by default; do not enable on PR CI.
quickjs = ["tekto-js/quickjs", "tekto/quickjs"]

[dependencies]
tekto = { workspace = true }
tekto-mcp = { workspace = true }
tekto-js = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
