[package]
name = "tekto-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Windowing and event-loop backends for Tekto (winit on desktop, stubs for Android and web)"
publish = false

[features]
default = ["cpu"]
cpu = ["tekto-render/cpu"]
# Windowed shell (Windows / Linux / macOS, and Android via NativeActivity).
# Off for wasm checks and for lean CPU-only Android compiles of `tekto`.
desktop = ["dep:winit", "dep:softbuffer", "cpu"]
# Publish the AccessKit tree to the OS (AT-SPI, UIA, …). Off by default so
# everyday dev and CI builds stay lean; accesskit_winit pulls accesskit_unix
# on Linux.
a11y-os = ["desktop", "dep:accesskit_winit"]
# Paint the desktop window with wgpu / Vello. The CPU renderer stays
# available as a fallback when no adapter can be created.
gpu = ["desktop", "tekto-render/gpu"]

[dependencies]
tekto-tree = { workspace = true }
tekto-layout = { workspace = true }
tekto-render = { workspace = true }
tekto-a11y = { workspace = true }
tekto-mcp = { workspace = true }
accesskit = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true, default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }

# Android window: NativeActivity via android-activity (pulled by winit).
# This must not appear in the default Linux/Windows crate graph.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, optional = true, features = ["android-native-activity"] }
softbuffer = { workspace = true, optional = true }
