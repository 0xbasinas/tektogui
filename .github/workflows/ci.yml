name: CI

on:
  pull_request:
  push:
    branches: [nightly, main]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run Windows and Android compile jobs"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: Linux check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Replay (`record_replay`) and the Notes PNG byte compare
      # (`headless_snapshot`) are integration tests. They run here.
      # Do not add a second test job for them.
      - name: Test (replay + headless PNG compare)
        run: cargo test --workspace --all-targets
      - name: JS package tests
        run: node --test packages/core/test.js packages/jsx-runtime/test.js packages/create-tektogui/test/index.test.js

  windows:
    name: Windows compile
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check
      - name: Check
        run: cargo check --workspace --all-targets

  android:
    name: Android compile
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-check
      - name: Check (CPU / no desktop shell)
        run: cargo check -p tekto --target aarch64-linux-android --no-default-features --features cpu
      - name: Check Notes Android skeleton
        run: cargo check -p notes-android --target aarch64-linux-android

  wasm:
    name: WASM and QuickJS checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-check
      - name: Install esbuild
        run: |
          npm install --prefix "$RUNNER_TEMP/tekto-ci" --no-save --no-package-lock esbuild@0.25.12
          echo "$RUNNER_TEMP/tekto-ci/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build WASM core and op bridge
        run: cargo build -p tekto-wasm --target wasm32-unknown-unknown
      - name: Check tekto CPU + HostOp (no desktop shell, no quickjs, no gpu)
        run: cargo check -p tekto --target wasm32-unknown-unknown --no-default-features --features cpu,js
      - name: Test WASM in Node (required)
        run: npm run test:wasm:required
      - name: Test QuickJS
        env:
          TEKTO_REQUIRE_ESBUILD: "1"
        run: cargo test -p tekto-js --features quickjs
