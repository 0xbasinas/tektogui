name: CI

on:
  pull_request:
  push:
    branches: [nightly, main]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run Windows and Android compile jobs"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: Linux check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes headless snapshot)
        run: cargo test --workspace --all-targets

  windows:
    name: Windows compile
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check
      - name: Check
        run: cargo check --workspace --all-targets

  android:
    name: Android compile
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-check
      - name: Check (CPU / no desktop shell)
        run: cargo check -p tekto --target aarch64-linux-android --no-default-features --features cpu
      - name: Check Notes Android skeleton
        run: cargo check -p notes-android --target aarch64-linux-android
