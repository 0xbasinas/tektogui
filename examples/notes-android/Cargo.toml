[package]
name = "notes-android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Notes example as an Android APK (NativeActivity + CPU renderer)"
publish = false

[lib]
name = "notes_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dep (not workspace=true) so default-features=false is honored
# on edition 2021.
tekto = { path = "../../crates/tekto", default-features = false, features = ["cpu"] }

[features]
default = []
# Embeds QuickJS-ng in the APK so `tekto dev --js --android` can POST a
# bundle over adb forward. Off by default: compiling rquickjs for two
# Android ABIs is slow, and nightly PR-less Android CI stays lean.
quickjs = ["tekto/quickjs"]
# Optional wgpu / Vello paint. Off by default. Even with this feature,
# the window stays on the CPU renderer unless TEKTO_ANDROID_GPU=1.
# Drivers were not proven in this repo (no device GPU, no emulator).
gpu = ["tekto/gpu"]

[target.'cfg(target_os = "android")'.dependencies]
tekto = { path = "../../crates/tekto", default-features = false, features = ["cpu", "desktop"] }

# cargo-apk2 (MIT OR Apache-2.0) packages this crate as a NativeActivity APK
# without a Gradle project. We use it instead of the older rust-mobile
# cargo-apk (which has stagnated) and instead of a Gradle wrapper (heavier,
# more files). See examples/notes-android/README.md.
[package.metadata.android]
package = "com.tektogui.notes"
apk_name = "notes"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
include_cplusplus_shared = true

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 30

# Needed to bind the loopback dev server (127.0.0.1:8474) so the host
# can `adb forward` and run `tekto tree`.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Notes"
debuggable = true
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density"
launch_mode = "singleTask"

# cargo-apk2 only fills this if the entry already exists; NativeActivity
# otherwise looks for libmain.so and crashes.
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "notes_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
